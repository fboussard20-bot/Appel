<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Appel · Provence Travaux</title>
<style>
:root { --bg: #f3f4f1; --surface: #fff; --ink: #1f2a30; --muted: #66737a; --ok: #3d7a4f; --accent: #b8651b; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #14191c; --surface: #1d2428; --ink: #e8ece9; --muted: #9aa5ab; --ok: #6fbb83; --accent: #e08c42; color-scheme: dark; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 17px/1.4 -apple-system, system-ui, sans-serif;
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
.card { background: var(--surface); border-radius: 16px; padding: 24px; text-align: center; width: 100%; max-width: 360px; box-sizing: border-box; }
h1 { font-size: 1.2rem; margin: 0 0 4px; }
p { color: var(--muted); margin: 0 0 18px; word-break: break-word; }
a.go { display: block; padding: 16px; border-radius: 12px; color: #fff; text-decoration: none; font-weight: 700; font-size: 1.1rem; background: var(--ok); }
a.go.mail { background: var(--accent); }
a.alt { display: block; margin-top: 12px; color: var(--muted); font-size: .9rem; }
.back { margin-top: 16px; font-size: .85rem; color: var(--muted); }
</style></head>
<body><div class="card" id="c"><h1>Provence Travaux</h1><p>Rien à appeler.</p></div>
<script>
const q = new URLSearchParams(location.hash.slice(1));
const wa = q.get("wa"), tel = q.get("tel"), mail = q.get("mail"), name = q.get("n") || "", subj = q.get("s") || "", body = q.get("b") || "";
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (t) => t.replace(/^\+33/, "0").replace(/(\d{2})(?=\d)/g, "$1 ").trim();
const c = document.getElementById("c");
if (wa) {
  // WhatsApp Business d'abord ; lien de secours vers WhatsApp classique
  const num = wa.replace(/\D/g, ""); const href = "whatsapp-smb://send?phone=" + num;
  c.innerHTML = `<h1>${esc(name || "WhatsApp")}</h1><p>${esc(fmt("+" + num))}</p><a class="go" style="background:#1fa855" href="${href}">Ouvrir WhatsApp Business</a><a class="alt" href="https://wa.me/${num}">ou avec WhatsApp</a><div class="back">Fermez cet onglet pour revenir au tableau de bord.</div>`;
  location.href = href;
} else if (tel) {
  const href = "tel:" + tel.replace(/[^\d+]/g, "");
  c.innerHTML = `<h1>${esc(name || "Appeler")}</h1><p>${esc(fmt(tel))}</p><a class="go" href="${href}">Appeler</a><div class="back">Après l'appel, fermez cet onglet pour revenir au tableau de bord.</div>`;
  location.href = href;
} else if (mail) {
  const enc = encodeURIComponent;
  const out = `ms-outlook://compose?to=${enc(mail)}${subj ? "&subject=" + enc(subj) : ""}${body ? "&body=" + enc(body) : ""}`;
  const mt = `mailto:${mail}?${subj ? "subject=" + enc(subj) : ""}${body ? "&body=" + enc(body) : ""}`;
  c.innerHTML = `<h1>${esc(name || "Écrire")}</h1><p>${esc(mail.split(",").join(", "))}</p><a class="go mail" href="${out}">Ouvrir dans Outlook</a><a class="alt" href="${mt}">ou avec l'appli Mail</a><div class="back">Fermez cet onglet pour revenir au tableau de bord.</div>`;
  location.href = out;
}
</script></body></html>
